<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">

    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white">
        GPU Management
      </h1>

      <p class="text-gray-400 mt-2">
        Inicia sesión para continuar
      </p>
    </div>

    <form class="space-y-5">

      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Correo electrónico
        </label>

        <input
          type="email"
          placeholder="correo@ejemplo.com"
          class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Contraseña
        </label>

        <input
          type="password"
          placeholder="********"
          class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 transition-all text-white font-semibold py-3 rounded-xl"
      >
        Iniciar sesión
      </button>

    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-400 text-sm">
        ¿No tienes cuenta?

        <a
          routerLink="/register"
          class="text-blue-400 hover:text-blue-300"
        >
          Regístrate
        </a>
      </p>
    </div>

  </div>

</div>
